<!DOCTYPE html>
<html>

<head>
    <title>SPAN ile HTML Şablonu</title>
</head>

<body>

    <p> Bu bir paragraf 
        <span style="color:green;font-weight:bold;"> 
            bu metne span etiketi kullanılarak yeşil renk ve kalın font stil uygulandı
        </span> paragrafın devamı
        <span style="color:blue;font-weight:bold;"> 
            bu metne span etiketi kullanılarak mavi renk ve kalın font stil uygulandı
        </span> 
        paragrafın sonu
    </p>

</body>

</html>
